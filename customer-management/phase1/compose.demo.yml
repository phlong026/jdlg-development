# Independent, local-only demo. Never point this service at a real customer database.
name: iyque-phase1-demo
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: iyque_phase1
      MYSQL_USER: crm
      MYSQL_PASSWORD: DemoDatabase!2026
      MYSQL_ROOT_PASSWORD: DemoRootOnly!2026
      TZ: Asia/Shanghai
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_bin"]
    volumes: ["demo-database:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql -uroot -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
  app:
    build:
      context: ..
      dockerfile: phase1/Dockerfile
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    ports: ["127.0.0.1:8087:8080"]
    environment:
      CRM_DB_URL: jdbc:mysql://db:3306/iyque_phase1?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
      CRM_DB_USER: crm
      CRM_DB_PASSWORD: DemoDatabase!2026
      CRM_ADMIN_PASSWORD: DemoAdmin!2026
      CRM_SECURE_COOKIE: "false"
      CRM_DEMO: "true"
      CRM_STANDALONE_ENABLED: "true"
      TZ: Asia/Shanghai
volumes:
  demo-database:
