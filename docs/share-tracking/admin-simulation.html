}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}

button,input,select,textarea{font:inherit;color:inherit}

button:hover:not(:disabled){border-color:var(--accent);background:var(--cream)}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

button.danger{color:var(--err);border-color:var(--err)}

.share-tracking{max-width:1200px;margin:0 auto;padding:14px 16px 60px}

.st-filters{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:12px}

.st-search{display:contents}
.st-warning{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 12px;margin:6px 0;font-size:13px}

.st-medium{color:#81430e;background:#fff0d7;border-color:#eed9b9}
.st-low,.st-unknown{color:#635e57;background:#f0eeeb}

.st-metrics dt,.st-duration-pair dt{font-size:12px;color:var(--muted)}

.st-duration-pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0}

.st-inline{border-top:1px dashed var(--line);padding-top:8px}

.sec h3{margin:0;font-size:16px}

.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px;display:grid;gap:8px}

.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:80;background:#3b2a1c;color:#fff;padding:10px 16px;border-radius:10px;max-width:90vw;font-size:13px}

/* requirement view */
.req{max-width:1200px;margin:0 auto;padding:20px 16px 60px}
.req table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:13px}
.req th,.req td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.req th{background:var(--cream)}
.st-ok{color:var(--ok);font-weight:600}.st-part{color:#b36b00;font-weight:600}.st-no{color:var(--err);font-weight:600}
.req-scroll{overflow-x:auto}
.callout{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 14px;margin:10px 0}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .st-heading h1{font-size:24px}
  .st-cards{grid-template-columns:1fr}
  .st-content-summary{grid-template-columns:1fr}
  .media .ph.r916{height:200px}

const toast = m => { const t = document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),3200); };

function inRange(date){
  if (S.range==='all') return true;
  if (S.range==='custom') return date.slice(0,10)>=S.start && date.slice(0,10)<=S.end;
  return daysAgo(date) <= Number(S.range)-1;
}
function rangeText(){
  if (S.range==='all') return '全部：当前权限内且仍在保留期的数据';
  let a,b;
  if (S.range==='custom'){ a=S.start; b=S.end; } else { b=TODAY; a=new Date(Date.parse(TODAY)-(Number(S.range)-1)*86400000).toISOString().slice(0,10); }
  const next = new Date(Date.parse(b)+86400000).toISOString().slice(0,10);
  return `${a} 00:00:00 ≤ 访问时间 < ${next} 00:00:00`;
}
function sorter(key){ return (x,y)=>{ const a = key==='last_visit'?x.last:key==='page_views'?x.pv:x.sec, b = key==='last_visit'?y.last:key==='page_views'?y.pv:y.sec; const c = a<b?-1:a>b?1:0; return (c||x.key?.localeCompare?.(y.key)||0) * (S.dir==='asc'?1:-1); }; }

function filteredVisitors(){
  let l = visitors.filter(v=>inRange(v.last) && (!S.identity||v.state===S.identity) && (!S.intent||(v.override?.level||v.level)===S.intent) && (!S.owner||v.owner===S.owner) && (!S.q||v.name.includes(S.q)||v.crm.includes(S.q)));
  return l.sort(sorter(S.sort));
}
function filteredContents(){
  let l = contents.filter(c=>inRange(c.last) && (!S.owner||c.owner===S.owner) && (!S.cq||c.title.includes(S.cq)));
  if (S.vq||S.identity) l = l.filter(c=>visitors.some(v=>v.mats.some(m=>m.cid===c.id) && (!S.vq||v.name.includes(S.vq)) && (!S.identity||v.state===S.identity)));
  l.sort((x,y)=>{ const k=S.sort; const a=k==='last_visit'?x.last:k==='page_views'?x.pv:x.sec, b=k==='last_visit'?y.last:k==='page_views'?y.pv:y.sec; return ((a<b?-1:a>b?1:0)||x.id.localeCompare(y.id))*(S.dir==='asc'?1:-1); });
  return l;
}
const contentOf = id => contents.find(c=>c.id===id);
const ph = (c,label) => `<div class="media"><div class="ph ${c.ratio}" role="img" aria-label="${esc(c.title)} 示意封面">${esc(label||'示意封面')}<br>${c.ratio==='r916'?'9:16':c.ratio==='r169'?'16:9':'4:3'} · 原比例 contain</div></div>`;

/* ---------- main render ---------- */
function render(){
  const app = $('app'); const p = can();
  if (!p.view){
    app.innerHTML = `<section class="st-feedback"><h1>分享访问记录</h1><p>当前账号尚未获得访问记录权限。请由有权管理员配置明确的组织与跟进范围。</p><button id="recheck">重新检查权限</button></section>`;
    $('recheck').onclick=()=>toast('仿真：重新检查权限（仍无权限，不会发起任何访客/素材查询）'); return;
  }
  const list = S.view==='visitors' ? filteredVisitors() : filteredContents();
  const idCount = S.view==='visitors' ? list.filter(v=>v.state==='identified').length : 0;
  const anCount = S.view==='visitors' ? list.filter(v=>v.state==='anonymous').length : 0;
  const empty = S.status==='empty' || list.length===0;
  app.innerHTML = `
  <header class="st-heading"><div><p class="st-eyebrow">可观测访问 · 有依据的跟进</p><h1>分享访问记录</h1><p>客户与素材，共用同一套访问口径。累计仅涵盖当前筛选范围。</p></div>
    <div class="st-heading-actions"><button id="bRules">意向规则与重算</button>${p.manage?'<button class="primary" id="bCreate">＋ 创建素材分享</button>':''}</div></header>
  ${S.role==='viewer'?'<p class="st-warning" role="status">当前为只读账号：不显示“创建素材分享”，客户详情中的 CRM 映射、人工修正、删除均需要各自独立授权。</p>':''}
  <div class="st-tabs" role="tablist" aria-label="记录视角"><button role="tab" aria-selected="${S.view==='visitors'}" data-view="visitors">客户视角</button><button role="tab" aria-selected="${S.view==='contents'}" data-view="contents">素材视角</button></div>
  <section class="st-filters" aria-label="访问筛选">
    <div class="st-range" role="group" aria-label="时间范围">${[['all','全部'],['3','近3天'],['7','近7天'],['30','近30天'],['custom','自定义']].map(([v,l])=>`<button aria-pressed="${S.range===v}" data-range="${v}">${l}</button>`).join('')}</div>
    ${S.range==='custom'?`<div class="form-row"><label>开始日期<input type="date" id="fStart" value="${S.start}"></label><label>结束日期（包含当天）<input type="date" id="fEnd" value="${S.end}"></label></div>`:''}
    <div class="st-filter-fields">
      <label>身份<select id="fIdentity"><option value="">全部身份</option><option value="identified">已识别账号</option><option value="anonymous">匿名访客</option>${S.view==='visitors'?'<option value="deleted">已删除账号</option>':''}</select></label>
      ${S.view==='visitors'?`<label>意向参考<select id="fIntent"><option value="">全部意向</option>${Object.entries(intentLabels).map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select></label>`:''}
      <label>跟进归属<select id="fOwner"><option value="">全部授权归属</option>${owners.map(o=>`<option value="${o.id}">${o.name}</option>`).join('')}</select></label>
      <label>排序<select id="fSort"><option value="last_visit">最近访问</option><option value="page_views">页面访问次数</option><option value="visible_ms">累计可见时长</option></select></label>
      <label>方向<select id="fDir"><option value="desc">从高到低 / 最新优先</option><option value="asc">从低到高 / 最早优先</option></select></label>
      ${S.view==='visitors'?`<label>查找访客<input type="search" id="fQ" maxlength="100" placeholder="授权昵称或客户业务编号" value="${esc(S.q)}"></label><button id="bQ">查询</button>`
        :`<label>素材标题<input type="search" id="fCQ" maxlength="100" placeholder="搜索素材标题" value="${esc(S.cq)}"></label><label>访问者昵称或标识<input type="search" id="fVQ" maxlength="100" placeholder="搜索授权昵称或访客标识" value="${esc(S.vq)}"></label><button id="bCQ">查询</button>`}
      <button id="bReset">清除筛选</button>
    </div>
    <p class="muted" style="margin:0">Asia/Shanghai · 自然日 · ${rangeText()} · 同值按稳定ID排序</p>
    ${S.notice?`<p class="st-warning" role="status">${esc(S.notice)}</p>`:''}
    ${S.view==='contents'?'<p class="muted" style="margin:0">标题筛选选择素材；访问者昵称和身份共同限定访客、访问及累计时长。各筛选同时生效，详情沿用相同范围。</p>':''}
  </section>

   :`<div class="st-cards" role="tabpanel" aria-label="${S.view==='visitors'?'客户访问列表':'素材访问列表'}">${list.map(S.view==='visitors'?visitorCard:contentCard).join('')}</div>
   <nav class="st-pager" aria-label="记录分页"><button disabled>上一页</button><span>第 1 页</span><button disabled>下一页</button></nav>`}
  <details class="st-rules-note"><summary>指标口径说明</summary><ul><li>页面访问（PV）仅在内容就绪且首次可见后计 1 次；“发起分享”不是送达，也不是访问。</li><li>可见时长只累加可证明的前台可见分段；后台、锁屏不计，强退不补造尾段。</li><li>意向仅用于跟进优先级参考，不代表真实需求或成交概率；规则按版本保留，不随列表筛选改变定义。</li></ul></details>`;
  // restore control values
  const set=(id,v)=>{ const e=$(id); if(e) e.value=v; };
  set('fIdentity',S.identity); set('fIntent',S.intent); set('fOwner',S.owner); set('fSort',S.sort); set('fDir',S.dir);
  bind();
}
function bind(){
  document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{ if(S.view===b.dataset.view)return; S.view=b.dataset.view; S.notice=''; if(S.view==='contents'&&S.intent){ S.intent=''; S.notice='意向筛选仅用于客户视角，已清除；素材身份和访客筛选独立保留'; } render(); });
  document.querySelectorAll('[data-range]').forEach(b=>b.onclick=()=>{ S.range=b.dataset.range; render(); });
  const on=(id,key)=>{ const e=$(id); if(e) e.onchange=()=>{ S[key]=e.value; render(); }; };
  on('fIdentity','identity'); on('fIntent','intent'); on('fOwner','owner'); on('fSort','sort'); on('fDir','dir'); on('fStart','start'); on('fEnd','end');
  const q=$('bQ'); if(q) q.onclick=()=>{ S.q=$('fQ').value; render(); };
  const cq=$('bCQ'); if(cq) cq.onclick=()=>{ S.cq=$('fCQ').value; S.vq=$('fVQ').value; render(); };
  $('bReset').onclick=()=>{ Object.assign(S,{range:'7',identity:'',intent:'',owner:'',sort:'last_visit',dir:'desc',q:'',cq:'',vq:'',notice:''}); render(); };
  $('bRefresh').onclick=()=>{ toast('仿真：已创建新快照并刷新（分页游标重置，筛选保留）'); };
  const rt=$('bRetry'); if(rt) rt.onclick=()=>{ $('status').value='normal'; S.status='normal'; render(); };
  $('bRules').onclick=openRules; const cr=$('bCreate'); if(cr) cr.onclick=()=>openEditor();
  document.querySelectorAll('[data-evidence]').forEach(b=>b.onclick=()=>{ S.open.ev[b.dataset.evidence]=!S.open.ev[b.dataset.evidence]; render(); });
  document.querySelectorAll('[data-vdetail]').forEach(b=>b.onclick=()=>openVisitor(b.dataset.vdetail,b.dataset.cid));
  document.querySelectorAll('[data-crm]').forEach(b=>b.onclick=()=>toast(b.dataset.crm==='1'?'仿真：重验当前 CRM 权限与确切映射后，跳转到客户主档（客户 / 线索）':'该访客未建立明确 CRM 映射，不显示客户身份或线索'));
  document.querySelectorAll('details[data-lazy]').forEach(d=>d.addEventListener('toggle',()=>{ S.open[d.dataset.lazy][d.dataset.id]=d.open; if(d.open&&!d.dataset.done){ d.dataset.done=1; d.querySelector('.lazy').innerHTML=lazyBody(d.dataset.lazy,d.dataset.id); bindLazy(d); } }));
  document.querySelectorAll('[data-cdetail]').forEach(b=>b.onclick=()=>openContent(b.dataset.cdetail));
  document.querySelectorAll('details[data-lazy]').forEach(d=>{ if(S.open[d.dataset.lazy][d.dataset.id]){ d.open=true; } });
}
function bindLazy(root){
  root.querySelectorAll('[data-vdetail]').forEach(b=>b.onclick=()=>openVisitor(b.dataset.vdetail,b.dataset.cid));
}
function lazyBody(kind,id){
  if(kind==='mat'){ const v=visitors.find(x=>x.key===id); if(!v.mats.length) return '<p class="muted">无可展示的素材访问记录。</p>';
    return v.mats.map(m=>{ const c=contentOf(m.cid); return `<div class="mini"><div class="thumb">${c.gone||c.status==='revoked'?'已撤回':'封面'}</div><div><strong>${esc(c.status==='revoked'?'（内容已撤回，仅保留受权历史统计）':c.title)}</strong><br><small class="muted">v${m.v} · ${m.pv} 次访问 · 累计可见 ${dur(m.sec)}</small></div><button data-vdetail="${esc(id)}" data-cid="${m.cid}">查看该版本访问轨迹</button></div>`; }).join('')
      +'<p class="muted">内容已撤回、过期或当前不可阅读时，仅展示有权访问的历史统计。</p>'; }
  if(kind==='cv'){ const rows=visitors.filter(v=>v.mats.some(m=>m.cid===id)&&(!S.vq||v.name.includes(S.vq))&&(!S.identity||v.state===S.identity));
    return rows.map(v=>{ const m=v.mats.find(x=>x.cid===id); return `<div class="mini"><div class="st-avatar">访</div><div><strong>${esc(v.name)}</strong><br><small class="muted">${esc(v.crm||'未关联客户')} · 本素材 ${m.pv} 次 · 累计可见 ${dur(m.sec)}</small></div><button data-vdetail="${esc(v.key)}" data-cid="${id}">展开轨迹</button></div>`; }).join('')||'<p class="muted">暂无符合筛选的访客。</p>'; }
  return '';
}
function visitorCard(v){
  const p=can(); const lvl=v.override?.level||v.level; const open=S.open.ev[v.key];
  return `<article class="st-visitor">
    <button class="st-card-main" data-vdetail="${esc(v.key)}"><span class="st-avatar">${v.state==='deleted'?'—':'访'}</span><span><strong>${esc(v.name)}</strong><small>${v.state==='identified'?'已登录账号 · ':''}${esc(v.crm||'未关联客户')}</small></span><span class="st-chevron" aria-hidden="true">›</span></button>
    <button class="st-intent st-${lvl}" data-evidence="${esc(v.key)}" aria-expanded="${!!open}">${intentLabels[lvl]}${v.override?'（人工修正）':''} · 查看依据</button>
    ${open?evidence(v):''}
    <dl class="st-metrics"><div><dt>页面访问</dt><dd>${v.pv} 次</dd></div><div><dt>会话</dt><dd>${v.sessions} 次</dd></div></dl>
    <dl class="st-duration-pair"><div><dt>最近一次（当前范围）</dt><dd>${dur(v.latest.sec)}</dd><small>进入 ${v.latest.start}:00</small></div><div><dt>当前范围累计可见</dt><dd>${dur(v.sec)}</dd></div></dl>
    <p class="muted" style="margin:0">最近活动 ${v.last}:00</p>
    <div class="st-card-actions">${p.crm?`<button data-crm="${v.crm?1:0}" ${v.state!=='identified'?'disabled':''}>查看客户 / 线索</button>`:''}<button data-vdetail="${esc(v.key)}">访问详情</button></div>
    <details class="st-inline" data-lazy="mat" data-id="${esc(v.key)}"><summary>查看访问素材（${v.mats.length}）</summary><div class="lazy"></div></details>

}
function evidence(v){
  const th=RULE; const o=v.override;
  return `<div class="st-evidence">
    <strong>规则 ${RULE.rule_version} · 近 ${th.window_days} 天（2026-09-15 至 2026-10-14）</strong>
    <div>${chip('有效会话 '+v.m.sessions)}${chip('已确认收藏 '+v.m.favorites)}${chip('已确认业务结果 '+v.m.biz)}</div>
    <ul>${v.reasons.map(r=>`<li>${esc(r)}</li>`).join('')}</ul>
    ${o?`<div><strong>原规则结果：</strong>${intentLabels[v.origLevel]}　<strong>人工修正：</strong>${intentLabels[o.level]}（原因：${esc(o.reason)}；有效至 ${o.expires}；操作人 ${esc(o.actor)}）</div>`:''}
    <div class="muted">不计入：${['匿名身份','后台预览','分享人自访','测试流量','重复事件','客户端点击','未经服务端确认的业务行为','超过每日贡献上限的部分'].map(chip).join('')}</div>
    <div class="muted">仅用于跟进优先级参考，不代表真实需求或成交概率。客户点击与已确认业务成功分别统计。</div></div>`;
}
const chip = t => `<span class="chip">${esc(t)}</span>`;

  const open = S.open.cv[c.id];
  return `<article class="st-content-card">
    <div class="st-content-summary">${ph(c,'授权封面')}<div>
      <button class="st-content-title" data-cdetail="${c.id}">${esc(c.status==='revoked'?c.title:c.title)}</button>
      <p style="margin:4px 0">${c.type} · v${c.ver} · <span class="badge ${c.status==='published'?'pub':'rev'}">${c.status==='published'?'已发布':'已撤回'}</span></p>
      <dl class="st-metrics"><div><dt>页面访问</dt><dd>${c.pv}</dd></div><div><dt>访客 UV</dt><dd>${c.uv}</dd></div></dl>
      <p class="muted" style="margin:6px 0 0">当前范围累计可见 ${dur(c.sec)} · 最近 ${c.last}</p></div></div>

/* ---------- dialogs ---------- */
let lastFocus=null;
function dialog(title, inner, opts={}){
  lastFocus=document.activeElement;
  $('layer').innerHTML=`<div class="overlay"><div class="dialog" role="dialog" aria-modal="true" aria-label="${esc(title)}" tabindex="-1"><header><h2>${esc(title)}</h2><button id="dClose" aria-label="关闭详情">关闭</button></header><div class="body">${inner}</div></div></div>`;
  const d=$('layer').querySelector('.dialog'); d.focus(); document.body.style.overflow='hidden';
  const close=()=>{ if(opts.dirty&&opts.dirty()&&!confirm('有未保存的修改，确认放弃并关闭？'))return; $('layer').innerHTML=''; document.body.style.overflow=''; lastFocus&&lastFocus.focus&&lastFocus.focus(); };
  $('dClose').onclick=close;
  d.addEventListener('keydown',e=>{ if(e.key==='Escape'){ e.stopPropagation(); close(); } });
  $('layer').querySelector('.overlay').addEventListener('mousedown',e=>{ if(e.target.classList.contains('overlay')) close(); });
  return {root:d, close};
}

function openVisitor(key, cid){
  const v=visitors.find(x=>x.key===key); const p=can(); const lvl=v.override?.level||v.level;
  const trail=(trails[key]||fallbackTrail(v)).filter(s=>true);
  const trailHtml=trail.map(s=>`<details class="st-inline" open><summary><strong>会话 ${s.id}</strong> · ${s.start} · ${esc(s.source)}</summary><div class="tl">${s.pages.map((pg,i)=>`
    <div class="pv"><strong>${esc(pg.t)}</strong> · ${pg.start} · 可见 ${dur(pg.sec)}${pg.flags.map(f=>` <span class="chip">${esc(f)}</span>`).join('')}
      <details data-ev="${s.id}-${i}"><summary class="muted">查看事件（按需加载）</summary>${pg.ev.map(e=>`<div class="ev">${eventLabels[e]||e}</div>`).join('')}</details></div>`).join('')}</div></details>`).join('');
  const matHtml=v.mats.map(m=>{ const c=contentOf(m.cid); return `<div class="mini"><div class="thumb">封面</div><div><strong>${esc(c.status==='revoked'?'（内容已撤回，仅保留受权历史统计）':c.title)}</strong><br><small class="muted">v${m.v} · ${m.pv} 次 · 累计 ${dur(m.sec)}</small></div>${cid===m.cid?'<span class="badge pub">当前查看</span>':''}</div>`; }).join('')||'<p class="muted">无素材访问。</p>';
  const gov = v.state==='deleted' ? '<p class="muted">该账号已删除，不提供治理操作。</p>'
    : (!p.crm&&!p.rules&&!p.del) ? '<p class="muted">当前账号没有适用于此访客的治理操作权限。</p>' : `
    <label>治理归属范围<select id="gOwner"><option value="">请选择归属范围</option>${owners.map(o=>`<option ${o.id===v.owner?'selected':''}>${o.name}</option>`).join('')}</select></label>
    <p class="muted" style="margin:0">CRM 映射和人工意向修正仅作用于所选归属；上方结果仍是当前列表筛选范围。删除操作不随此选择缩小。</p>
    ${p.crm?`<div class="sec"><h3>明确 CRM 映射</h3>${v.state!=='identified'?'<p class="muted">匿名访客不能建立 CRM 映射；须先由服务端确认登录账号。</p>':v.crm?`<p>当前映射：${esc(v.crm)}</p><button id="gUnlink">解除 CRM 映射</button>`:`
      <p class="muted" style="margin:0">只对已登录账号建立明确映射。客户 ID、业务编号及依据须通过上游业务关系与归属范围验证；昵称、头像、相似姓名或分享对象均不能作为自动匹配依据。验证未接入时服务端会拒绝。</p>
      <div class="form-row"><label>CRM 客户 ID<input id="gCid"></label><label>业务编号<input id="gNo"></label></div><label>已验证业务关系依据<textarea id="gBasis"></textarea></label><button class="primary" id="gLink">确认并提交映射</button>`}</div>`:''}

function openEditor(c){

  const dl=dialog('创建与管理素材分享', `
    <p class="muted" style="margin:0">人工录入已有内容。不自动抓取公众号文章；来源链接仅供核对。发布后的修改先保存为新草稿，历史访问保留原版本。</p>
    <div class="sec"><h3>① 录入正文</h3>
      <label>标题（必填，最多80字）<input id="eT" maxlength="80" value="${c?esc(c.title):''}"></label>
      <div class="form-row"><label>来源链接（仅供核对，不会被抓取）<input id="eU" placeholder="https://"></label><label>来源说明<input id="eN"></label></div>
      <div class="form-row"><label>正文格式<select><option>纯文本（保留换行）</option><option>受控富文本（HTML 源码）</option></select></label><label>使用权属<select id="eR"><option value="own">自有内容</option><option value="auth">已获授权</option></select></label><label>跟进归属<select id="eO"><option value="">请选择</option>${owners.map(o=>`<option>${o.name}</option>`).join('')}</select></label></div>
      <label>已有正文<textarea id="eB">${c?esc(c.body):''}</textarea></label>
      <p class="muted" style="margin:0">富文本仅支持 p、br、strong、em、h2、h3、ul、ol、li、blockquote。保存时服务端移除所有属性、脚本及外部嵌入。</p>
      <label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" id="eC" style="width:auto;min-height:0"> 我确认正文、封面与媒体具有使用权</label></div>
    <div class="sec"><h3>② 上传或选取授权媒体</h3><label>上传本地图片或视频（图片≤10MiB，MP4≤50MiB）<input type="file" accept="image/*,video/mp4" id="eF"></label>
      <p class="muted" style="margin:0">服务端校验真实字节、类型与尺寸；上传本身不等于发布。暂无可选授权媒体时，缺少封面不能发布。原图/视频按 contain 完整展示、不拉伸。</p></div>
    <div class="sec"><h3>③ 保存草稿并预览</h3><button id="eSave">保存草稿并预览</button><div id="ePrev" hidden>
      <p class="st-warning">此处为后台预览，不进入客户访问统计。小程序排版与设备兼容仍需真机核验。编辑正文会使预览失效。</p>
      <label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" id="eOk" style="width:auto;min-height:0"> 已核对正文、媒体及归属，确认发布</label>
      <button class="primary" id="ePub" disabled>发布并获取分享方式</button></div></div>
    <div class="sec" id="eShare" hidden><h3>④ 分享方式</h3><p style="margin:0">已发布为不可变版本。</p>
      <p class="st-warning" style="margin:0">当前未接通经核验的微信码 / URL Link：不生成假二维码，也不用普通 HTTPS 短链替代。请在小程序“我的 → 可分享素材”打开固定阅读页，用原生入口分享。后台不能直接发送微信卡片。</p></div>
    ${c&&c.status==='published'?`<div class="sec"><h3>撤回已发布素材</h3><label>撤回原因<textarea id="eRvWhy"></textarea></label><button class="danger" id="eRv">撤回并停止旧入口阅读</button></div>`:''}`,
    {dirty:()=>dirty});
  const r=dl.root, g=s=>r.querySelector(s);
  r.addEventListener('input',()=>{ dirty=true; if(g('#ePrev')&&!g('#ePrev').hidden){ g('#ePrev').hidden=true; g('#eSave').textContent='保存草稿并预览'; toast('正文已修改，预览已失效，请重新保存预览'); } });
  g('#eSave').onclick=()=>{ if(!g('#eT').value.trim()) return toast('标题必填'); if(!g('#eC').checked) return toast('请先确认使用权'); if(!g('#eO').value) return toast('请选择跟进归属'); g('#ePrev').hidden=false; g('#eSave').textContent='重新保存草稿并预览'; dirty=false; };
  g('#eOk').onchange=e=>{ g('#ePub').disabled=!e.target.checked; };
  g('#ePub').onclick=()=>{ g('#eShare').hidden=false; g('#ePub').disabled=true; toast('仿真：已发布（带预览令牌与幂等键，重复提交不重复发布）'); };
  if(g('#eRv')) g('#eRv').onclick=()=>{ if(!g('#eRvWhy').value.trim()) return toast('撤回原因必填'); toast('仿真：已撤回，所有旧入口不能继续读取；既有访问保留历史版本'); };
}

  <li><strong>验收层面：</strong>17 项<strong class="st-no">均未整体签收</strong>。真实数据库/CRM/微信、六宽度浏览器截图、iOS/Android 真机、压测与回滚演练都未做。</li>
  <li><strong>按设计未交付：</strong>公众号自动导入、URL Link / 微信码（无核验接口则不展示）、AI 评分（均为 P1 或待核验）。</li>
  <li><strong>已知缺口：</strong>预约/报价没有可信成功源、企微聊天无身份桥；计时/队列阈值无运行时配置界面；朋友圈首次同步无令牌时不宣称可追踪。</li></ul>`;
}
