# 内容分享入口；安装后必须通过 nginx -t 才能加载。
# 拟安装到 /www/server/panel/vhost/nginx/extension/www.jiadilingguang.com/phase3-share.conf
# 现有 API 主配置已实读使用 http://localhost:8080；此处保留完整 URI。
# Go 必须先实现并验证下列路由，再按发布流程启用此文件。

# ^~ 避免官网现有 js/css/图片正则把分享页资源当作官网本地文件。
location ^~ /share/ {
    # 短码不进入官网原始访问日志；Go须保留脱敏状态、耗时和错误日志。
    access_log off;
    proxy_pass http://localhost:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 60s;
}

# 匿名网页只使用这一组受限接口，不代理管理 API。
location ^~ /api/v1/share-web/ {
    access_log off;
    proxy_pass http://localhost:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 60s;
}
