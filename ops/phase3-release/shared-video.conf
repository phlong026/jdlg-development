# 安装到实际承载 api.jiadilingguang.com 的 server 块 include 目录。
# 与原站点配置合并前核对已有 location；先 nginx -t，再 reload。
# 短时播放票据和原始分享令牌不得进入 Nginx 原始访问日志。
location ^~ /api/v1/shared-video/ {
    access_log off;
    # Nginx上游错误会附原始request URI；状态/耗时由Go脱敏日志保留。
    error_log /dev/null emerg;
    proxy_pass http://localhost:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_buffering off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 60s;
}

location ^~ /api/v1/miniprogram/project-notes/ {
    access_log off;
    # Nginx上游错误会附原始request URI；状态/耗时由Go脱敏日志保留。
    error_log /dev/null emerg;
    proxy_pass http://localhost:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 60s;
    # 保留既有500MiB私有视频上传请求体上限（含multipart开销）。
    client_max_body_size 501m;
}

