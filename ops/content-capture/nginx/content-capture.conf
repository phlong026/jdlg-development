location = /_internal/content-capture/v1/capture {
    allow 127.0.0.1;
    allow ::1;
    deny all;
    access_log off;
    client_max_body_size 64k;
    proxy_http_version 1.1;
    proxy_set_header Host localhost;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection close;
    proxy_connect_timeout 2s;
    proxy_send_timeout 10s;
    proxy_read_timeout 125s;
    proxy_pass http://unix:/run/jdlg-content-capture/capture.sock:/v1/capture;
}

location = /_internal/content-capture/ready {
    allow 127.0.0.1;
    allow ::1;
    deny all;
    access_log off;
    proxy_http_version 1.1;
    proxy_set_header Host localhost;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection close;
    proxy_connect_timeout 2s;
    proxy_send_timeout 5s;
    proxy_read_timeout 5s;
    proxy_pass http://unix:/run/jdlg-content-capture/capture.sock:/health/ready;
}
